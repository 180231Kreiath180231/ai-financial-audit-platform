[project]
name = "hengjian-audit-platform"
version = "0.1.0"
description = "Local-first AI financial audit workbench"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.5,<2",
  "fastapi>=0.116,<1",
  "openpyxl>=3.1,<4",
  "pillow>=12,<13",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "pypdfium2>=5.13,<6",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "requests>=2.34,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
