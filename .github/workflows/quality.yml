name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.x"
          enable-cache: true
      - name: Install dependencies
        shell: pwsh
        run: |
          uv sync --frozen
          npm.cmd --prefix frontend ci
      - name: Static checks, unit tests, and build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1
      - name: Install Playwright Chromium
        shell: pwsh
        run: npm.cmd --prefix frontend exec playwright install chromium
      - name: Browser acceptance tests
        shell: pwsh
        run: npm.cmd --prefix frontend run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
